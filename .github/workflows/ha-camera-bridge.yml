name: Home Assistant camera bridge
on:
  push:
    paths:
      - 'integrations/home-assistant/**'
      - '.github/workflows/ha-camera-bridge.yml'
  pull_request:
    paths:
      - 'integrations/home-assistant/**'
      - '.github/workflows/ha-camera-bridge.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/home-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
